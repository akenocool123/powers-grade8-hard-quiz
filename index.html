<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Powers Challenge — Grade 8</title>
<style>
:root{--ink:#14213d;--blue:#367ff0;--purple:#7054c8;--orange:#ff9f43;--green:#16875c;--red:#cf4b4b;--muted:#667085;--line:#d8e2ef;--pale:#eaf4ff;--mint:#e5f7ee;--cream:#fff5dc;--lav:#f0ecff;--white:#fff;--bg:#e8eef7}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#f7fbff 0 16%,transparent 40%),linear-gradient(135deg,#dfe8f6,#f4f7fb);padding:18px}
button,input{font:inherit}.app{width:min(1080px,100%);min-height:calc(100vh - 36px);margin:auto;background:#fff;border-radius:24px;box-shadow:0 22px 70px #22334b25;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}.topline{height:9px;background:linear-gradient(90deg,var(--purple),var(--blue),var(--orange))}.header{padding:18px 28px 14px;border-bottom:1px solid var(--line)}.headrow{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:900;letter-spacing:.08em;color:var(--blue);font-size:13px}.score{font-weight:900;color:var(--purple);white-space:nowrap}.progress{height:9px;background:#e6ebf2;border-radius:99px;overflow:hidden;margin-top:13px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:.35s}.main{padding:26px 34px 20px;display:flex;flex-direction:column}.meta{display:flex;align-items:center;gap:10px;margin-bottom:8px}.tag{padding:7px 11px;border-radius:999px;background:var(--lav);color:var(--purple);font-weight:900;font-size:13px}.difficulty{background:var(--cream);color:#8b5b00}.qtitle{font-size:clamp(25px,3.3vw,42px);line-height:1.12;margin:7px 0 14px}.instruction{font-size:18px;color:var(--muted);line-height:1.45;margin:0 0 18px}.math{font-family:"Cambria Math","Times New Roman",serif}.expression{width:fit-content;max-width:100%;margin:6px auto 22px;padding:18px 30px;border-radius:17px;background:var(--pale);font:700 clamp(26px,4vw,44px)/1.2 "Cambria Math","Times New Roman",serif;text-align:center}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:880px;width:100%;margin:auto}.option{border:2px solid var(--line);background:#fff;border-radius:14px;padding:15px 18px;font-size:20px;font-weight:800;color:var(--ink);cursor:pointer;transition:.18s;text-align:left}.option:hover{border-color:var(--blue);transform:translateY(-1px)}.option.selected{background:var(--pale);border-color:var(--blue);box-shadow:0 0 0 3px #367ff020}.option.correct{background:var(--mint);border-color:var(--green)}.option.wrong{background:#fff0f0;border-color:var(--red)}
.inputwrap{display:flex;justify-content:center}.answerinput{width:min(500px,100%);border:2px solid var(--line);border-radius:14px;padding:15px 18px;font-size:23px;text-align:center;outline:none}.answerinput:focus{border-color:var(--blue);box-shadow:0 0 0 4px #367ff01c}.hintline{text-align:center;color:var(--muted);margin-top:10px;font-size:14px}
.drag-layout{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;align-items:start}.bank,.slots,.bucket{border:2px dashed #b9c8da;border-radius:17px;padding:14px;min-height:100px;background:#f9fbfe}.bank h3,.slots h3,.bucket h3{font-size:16px;margin:0 0 10px;color:var(--muted)}.drag-item{padding:13px 15px;margin:9px 0;border:2px solid var(--blue);border-radius:12px;background:var(--pale);font-size:20px;font-weight:800;text-align:center;cursor:grab;touch-action:none}.drag-item.selected-drag{outline:4px solid #ff9f4355;border-color:var(--orange)}.drag-item.dragging{opacity:.45}.matchrow{display:grid;grid-template-columns:minmax(180px,1fr) 48px minmax(180px,1fr);align-items:center;gap:8px;margin:9px 0}.match-expression{font:700 21px "Cambria Math","Times New Roman",serif;text-align:right}.match-arrow{text-align:center;color:var(--purple);font-size:25px}.drop-slot{min-height:55px;border:2px dashed var(--purple);border-radius:12px;background:var(--lav);padding:5px}.drop-slot.over,.bucket.over{background:#e7ddff}.drop-slot .drag-item,.bucket .drag-item{margin:0}.bucket-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bucket{min-height:175px}.bucket.true{background:#f1fbf6}.bucket.false{background:#fff7f1}.statement-bank{display:grid;grid-template-columns:1fr 1fr;gap:8px}.statement-bank .drag-item{font-size:17px;margin:0;text-align:left}
.scene{height:112px;margin:0 auto 18px;width:min(760px,100%);border-radius:18px;background:linear-gradient(135deg,#eef6ff,#f4efff);position:relative;overflow:hidden}.bacteria{display:flex;gap:13px;align-items:center;justify-content:center;height:100%}.germ{width:30px;height:30px;border-radius:48% 52% 44% 56%;background:linear-gradient(135deg,var(--blue),var(--purple));animation:pulse 1.25s infinite alternate}.germ:nth-child(2n){animation-delay:.3s}.germ:nth-child(3n){animation-delay:.6s}@keyframes pulse{to{transform:scale(.72);opacity:.65}}.micro{display:grid;place-items:center;height:100%;font-size:64px}.micro:after{content:"";position:absolute;width:25px;height:25px;border-radius:50%;background:var(--purple);left:35%;top:44%;animation:cell 1.6s infinite alternate}@keyframes cell{to{transform:scale(1.8);opacity:.35}}.squares{height:100%;display:flex;align-items:center;justify-content:center;gap:58px}.sq{border:5px solid var(--blue);background:#367ff018}.sq.small{width:34px;height:34px}.sq.large{width:88px;height:88px;animation:grow 1.8s infinite alternate}@keyframes grow{to{transform:scale(1.16)}}.arrowbig{font-size:42px;color:var(--purple)}
.feedback{display:none;margin:18px auto 0;padding:14px 18px;border-radius:13px;max-width:880px;width:100%;font-size:17px;font-weight:800;line-height:1.4}.feedback.show{display:block}.feedback.good{background:var(--mint);border-left:7px solid var(--green)}.feedback.bad{background:#fff0f0;border-left:7px solid var(--red)}.footer{border-top:1px solid var(--line);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer;background:var(--ink);color:#fff}.btn.check{background:var(--purple)}.btn.next{background:var(--green);display:none}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}.footer-note{font-size:14px;color:var(--muted)}
.result{text-align:center;margin:auto;max-width:720px}.result h1{font-size:clamp(40px,6vw,70px);margin:0 0 12px}.result-score{font-size:clamp(55px,10vw,105px);font-weight:900;color:var(--purple)}.result p{font-size:20px;color:var(--muted);line-height:1.5}.review{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.review div{padding:13px;border-radius:12px;background:var(--pale);font-weight:800}.review .miss{background:#fff0f0;color:var(--red)}sup{font-size:.64em;line-height:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){body{padding:0}.app{min-height:100vh;border-radius:0}.header,.footer{padding-left:16px;padding-right:16px}.main{padding:20px 16px}.options,.drag-layout{grid-template-columns:1fr}.statement-bank{grid-template-columns:1fr}.qtitle{font-size:28px}.expression{font-size:29px;padding:15px}.matchrow{grid-template-columns:1fr 32px 1fr}.match-expression{font-size:18px}.drag-item{font-size:18px}.footer-note{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
  <div><div class="topline"></div><header class="header"><div class="headrow"><div class="brand">GRADE 8 • LEBANESE CURRICULUM</div><div class="score" id="score">First-try score: 0</div></div><div class="progress"><span id="bar"></span></div></header></div>
  <section class="main" id="main" aria-live="polite"></section>
  <footer class="footer" id="footer"><button class="btn secondary" id="restart" type="button">Restart</button><span class="footer-note">Drag with a mouse, or tap an item then tap its destination.</span><div><button class="btn check" id="check" type="button">Check answer</button> <button class="btn next" id="next" type="button">Next →</button></div></footer>
</main>
<script>
(()=>{
"use strict";
const questions=[
 {type:"mcq",skill:"Signs & parentheses",title:"Determine all four signs without calculating.",instruction:"Choose the sequence of signs in the same order.",expr:"(−3)<sup>7</sup> ; −3<sup>8</sup> ; (−2)<sup>0</sup> ; −(−5)<sup>9</sup>",options:["−, +, +, −","−, −, +, +","+, −, +, +","−, −, −, +"],answer:1,explain:"(−3)⁷ is negative; −3⁸ has the minus outside; (−2)⁰ = 1; and −(−5)⁹ is the opposite of a negative number."},
 {type:"mcq",skill:"One single power",title:"Reduce the expression to one power of 2.",instruction:"Use the product, quotient and power-of-a-power properties.",expr:"<span class='frac'><span>2<sup>5</sup> × 2<sup>3</sup></span><span>2<sup>4</sup></span></span> × (2<sup>2</sup>)<sup>3</sup>",options:["2⁴","2⁷","2¹⁰","2¹²"],answer:2,explain:"Add 5 + 3, subtract 4, then add 2 × 3: 5 + 3 − 4 + 6 = 10."},
 {type:"match",skill:"Drag & drop • Properties",title:"Match each expression with its simplified form.",instruction:"Drag every result to the correct expression.",pairs:[{left:"3⁴ × 5⁴",accept:"a"},{left:"(7²)³",accept:"b"},{left:"x⁹ ÷ x⁴",accept:"c"}],items:[{id:"c",text:"x⁵"},{id:"a",text:"15⁴"},{id:"b",text:"7⁶"}],explain:"Same exponent combines bases; a power of a power multiplies exponents; division with the same base subtracts exponents."},
 {type:"mcq",skill:"Negative base",title:"Keep the correct base and simplify.",instruction:"Parentheses are part of the base.",expr:"<span class='frac'><span>(−3)<sup>4</sup> × (−3)<sup>7</sup></span><span>(−3)<sup>5</sup></span></span>",options:["−3⁶","(−3)⁶","(−3)¹⁶","3⁻⁶"],answer:1,explain:"The base is (−3), so the exponent is 4 + 7 − 5 = 6. The result is (−3)⁶."},
 {type:"mcq",skill:"Real life • Growth",title:"A bacteria culture triples every 20 minutes.",instruction:"It starts with 2 bacteria. How many bacteria are present after 2 hours?",visual:"bacteria",expr:"2 × 3<sup>?</sup>",options:["486","729","1 458","4 374"],answer:2,explain:"Two hours contain 6 periods of 20 minutes, so the population is 2 × 3⁶ = 2 × 729 = 1 458."},
 {type:"buckets",skill:"Drag & drop • True or false",title:"Classify every statement.",instruction:"Drag each statement into the True or False box.",items:[{id:"s1",text:"(−5)¹² = −5¹²",truth:false},{id:"s2",text:"(−7)¹³ = −7¹³",truth:true},{id:"s3",text:"10⁻⁴ > 10⁻³",truth:false},{id:"s4",text:"(a³)⁴ = a⁷",truth:false}],explain:"An even power of a negative base is positive; an odd power remains negative; 10⁻⁴ is smaller than 10⁻³; and (a³)⁴ = a¹²."},
 {type:"mcq",skill:"Powers of 10",title:"Write the expression as one power of 10.",instruction:"Do the work in the exponents before calculating any value.",expr:"<span class='frac'><span>(10<sup>−3</sup> × 10<sup>7</sup>)<sup>2</sup></span><span>10<sup>5</sup></span></span>",options:["10⁻¹","10³","10⁸","10¹⁵"],answer:1,explain:"Inside the parentheses: 10⁻³ × 10⁷ = 10⁴. Then (10⁴)² ÷ 10⁵ = 10⁸⁻⁵ = 10³."},
 {type:"mcq",skill:"Real life • Scientific notation",title:"A cell is 0.0000075 m long.",instruction:"Write its length in scientific notation.",visual:"cell",options:["7.5 × 10⁻⁵ m","7.5 × 10⁻⁶ m","0.75 × 10⁻⁵ m","75 × 10⁻⁷ m"],answer:1,explain:"Move the decimal 6 places right to obtain 7.5, so the exponent is −6: 7.5 × 10⁻⁶ m."},
 {type:"mcq",skill:"Scientific notation",title:"Calculate and return to standard scientific notation.",instruction:"The first factor must satisfy 1 ≤ a < 10.",expr:"(6 × 10<sup>7</sup>)(4 × 10<sup>−3</sup>)",options:["2.4 × 10⁴","2.4 × 10⁵","24 × 10⁵","2.4 × 10¹⁰"],answer:1,explain:"6 × 4 = 24 and 10⁷ × 10⁻³ = 10⁴. Thus 24 × 10⁴ = 2.4 × 10⁵."},
 {type:"match",skill:"Drag & drop • Reasoning order",title:"Place the simplification steps in order.",instruction:"Match Step 1 through Step 4 for (5³)² × 5⁻⁴ ÷ 5.",pairs:[{left:"Step 1",accept:"o1"},{left:"Step 2",accept:"o2"},{left:"Step 3",accept:"o3"},{left:"Step 4",accept:"o4"}],items:[{id:"o3",text:"5⁽⁶⁻⁴⁻¹⁾"},{id:"o1",text:"(5³)² = 5⁶"},{id:"o4",text:"5¹ = 5"},{id:"o2",text:"5⁶ × 5⁻⁴ ÷ 5¹"}],explain:"First apply the power of a power. Then express every term with base 5, combine exponents, and evaluate 5¹."},
 {type:"mcq",skill:"Real life • Area scaling",title:"A square poster is enlarged using a scale factor of 2³.",instruction:"By what factor does its area increase?",visual:"square",expr:"Area factor = (2<sup>3</sup>)<sup>2</sup>",options:["2⁵ = 32","2⁶ = 64","2⁹ = 512","2³ = 8"],answer:1,explain:"Area depends on two dimensions, so the linear factor is squared: (2³)² = 2⁶ = 64."},
 {type:"mcq",skill:"Final challenge",title:"Simplify completely.",instruction:"Notice that 3/2 is the reciprocal of 2/3.",expr:"<span class='frac'><span>(2/3)<sup>4</sup> × (3/2)<sup>2</sup></span><span>(2/3)<sup>−1</sup></span></span>",options:["2/3","4/9","8/27","27/8"],answer:2,explain:"Since (3/2)² = (2/3)⁻², the exponent becomes 4 − 2 − (−1) = 3. Therefore (2/3)³ = 8/27."}
];

const main=document.getElementById("main"),bar=document.getElementById("bar"),scoreEl=document.getElementById("score"),check=document.getElementById("check"),next=document.getElementById("next"),restart=document.getElementById("restart");
let index=0,score=0,attempted=false,solved=false,selectedDrag=null,firstResults=[];

function scene(type){if(type==="bacteria")return `<div class="scene"><div class="bacteria">${Array(12).fill('<span class="germ"></span>').join('')}</div></div>`;if(type==="cell")return '<div class="scene"><div class="micro" aria-label="Animated microscopic cell">🔬</div></div>';if(type==="square")return '<div class="scene"><div class="squares"><div class="sq small"></div><div class="arrowbig">→</div><div class="sq large"></div></div></div>';return ''}
function fracStyle(){return `<style>.frac{display:inline-grid;vertical-align:middle;text-align:center}.frac>span:first-child{border-bottom:3px solid currentColor;padding:0 6px 4px}.frac>span:last-child{padding-top:3px}</style>`}
function render(){const q=questions[index];attempted=false;solved=false;selectedDrag=null;check.style.display="inline-block";next.style.display="none";next.textContent=index===questions.length-1?"See results →":"Next →";bar.style.width=`${index/questions.length*100}%`;scoreEl.textContent=`First-try score: ${score}`;
 let body="";
 if(q.type==="mcq")body=`${scene(q.visual)}${q.expr?`<div class="expression">${q.expr}</div>`:""}<div class="options">${q.options.map((o,i)=>`<button class="option" data-choice="${i}" type="button">${o}</button>`).join("")}</div>`;
 if(q.type==="match")body=`<div class="drag-layout"><div class="bank" id="bank"><h3>DRAGGABLE ANSWERS</h3>${q.items.map(x=>`<div class="drag-item math" draggable="true" tabindex="0" data-id="${x.id}">${x.text}</div>`).join("")}</div><div class="slots"><h3>DESTINATIONS</h3>${q.pairs.map(p=>`<div class="matchrow"><div class="match-expression">${p.left}</div><div class="match-arrow">→</div><div class="drop-slot" data-accept="${p.accept}"></div></div>`).join("")}</div></div>`;
 if(q.type==="buckets")body=`<div class="statement-bank bank" id="bank">${q.items.map(x=>`<div class="drag-item math" draggable="true" tabindex="0" data-id="${x.id}">${x.text}</div>`).join("")}</div><div class="bucket-layout"><div class="bucket true" data-bucket="true"><h3>TRUE</h3></div><div class="bucket false" data-bucket="false"><h3>FALSE</h3></div></div>`;
 main.innerHTML=`${fracStyle()}<div class="meta"><span class="tag">Question ${index+1} of ${questions.length}</span><span class="tag difficulty">Hard level</span><span class="tag">${q.skill}</span></div><h1 class="qtitle">${q.title}</h1><p class="instruction">${q.instruction}</p>${body}<div class="feedback" id="feedback"></div>`;
 bind();
}
function bind(){document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{if(solved)return;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}));
 document.querySelectorAll(".drag-item").forEach(item=>{item.addEventListener("dragstart",e=>{selectedDrag=item;item.classList.add("dragging");e.dataTransfer.setData("text/plain",item.dataset.id)});item.addEventListener("dragend",()=>item.classList.remove("dragging"));item.addEventListener("click",()=>{if(solved)return;document.querySelectorAll(".drag-item").forEach(x=>x.classList.remove("selected-drag"));selectedDrag=item;item.classList.add("selected-drag")})});
 document.querySelectorAll(".drop-slot,.bucket").forEach(zone=>{zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("over")});zone.addEventListener("dragleave",()=>zone.classList.remove("over"));zone.addEventListener("drop",e=>{e.preventDefault();zone.classList.remove("over");const id=e.dataTransfer.getData("text/plain");place(document.querySelector(`.drag-item[data-id="${id}"]`),zone)});zone.addEventListener("click",()=>{if(selectedDrag&&!solved)place(selectedDrag,zone)})});
}
function place(item,zone){if(!item)return;if(zone.classList.contains("drop-slot")){const old=zone.querySelector(".drag-item");if(old)document.getElementById("bank").appendChild(old)}zone.appendChild(item);item.classList.remove("selected-drag");selectedDrag=null}
function evaluate(){const q=questions[index];if(solved)return;let ok=false,hasAnswer=true;
 if(q.type==="mcq"){const choice=document.querySelector(".option.selected");if(!choice)hasAnswer=false;else{ok=+choice.dataset.choice===q.answer;document.querySelectorAll(".option")[q.answer].classList.add("correct");if(!ok)choice.classList.add("wrong")}}
 if(q.type==="match"){const slots=[...document.querySelectorAll(".drop-slot")];hasAnswer=slots.every(s=>s.querySelector(".drag-item"));ok=hasAnswer&&slots.every(s=>s.querySelector(".drag-item").dataset.id===s.dataset.accept)}
 if(q.type==="buckets"){const placed=[...document.querySelectorAll(".bucket .drag-item")];hasAnswer=placed.length===q.items.length;ok=hasAnswer&&placed.every(el=>String(q.items.find(x=>x.id===el.dataset.id).truth)===el.parentElement.dataset.bucket)}
 const fb=document.getElementById("feedback");if(!hasAnswer){fb.className="feedback show bad";fb.textContent="Complete every part before checking.";return}
 if(!attempted){firstResults[index]=ok;if(ok)score++;attempted=true;scoreEl.textContent=`First-try score: ${score}`}
 if(ok){solved=true;fb.className="feedback show good";fb.innerHTML=`✓ Correct. ${q.explain}`;check.style.display="none";next.style.display="inline-block";bar.style.width=`${(index+1)/questions.length*100}%`;document.querySelectorAll(".option,.drag-item").forEach(x=>x.setAttribute("aria-disabled","true"))}
 else{fb.className="feedback show bad";fb.innerHTML=`Not yet. Review the bases, signs and exponent properties, then try again.`}
}
function results(){bar.style.width="100%";check.style.display="none";next.style.display="none";const percent=Math.round(score/questions.length*100);const msg=percent>=85?"Excellent mastery!":percent>=65?"Good work—review the missed skills and try once more.":"Keep practising the rules through expanded multiplication.";main.innerHTML=`<div class="result"><div class="brand">POWERS CHALLENGE COMPLETE</div><h1>Your result</h1><div class="result-score">${score}/12</div><p>${msg}</p><div class="review">${questions.map((q,i)=>`<div class="${firstResults[i]?"":"miss"}">Q${i+1}<br>${firstResults[i]?"✓ First try":"Review"}</div>`).join("")}</div><button class="btn check" type="button" id="again">Try again</button></div>`;document.getElementById("again").onclick=reset}
function reset(){index=0;score=0;firstResults=[];render()}
check.addEventListener("click",evaluate);next.addEventListener("click",()=>{if(index===questions.length-1)results();else{index++;render()}});restart.addEventListener("click",reset);document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!solved)evaluate();if(e.key==="ArrowRight"&&solved)next.click()});render();
})();
</script>
</body>
</html>
